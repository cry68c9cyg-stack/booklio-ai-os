name: Nasazení webu James Dean

# Jen ručně (Actions → Nasazení webu James Dean → Run workflow) a jen se souhlasem MC pro dané nasazení.
# Nasadí větev JDWEB veřejného repozitáře cry68c9cyg-stack/james-dean-web na worker james-dean-web-production
# (jamesdean.cz): testy, kontrola migrací, produkční build, nahrání verze a její nasazení na 100 %.
# Token OKO1 smí jen skripty Workerů (ne D1 ani trasy zóny), proto `wrangler versions upload/deploy` (trasy a cron
# zůstanou, jak jsou) a migrace se nespouštějí: nasazení skončí dřív, než se cokoli změní, když repozitář má novější
# migraci, než jakou Claude ověřil v produkční D1 (vstup `overena_migrace`).
on:
  workflow_dispatch:
    inputs:
      overena_migrace:
        description: 'Poslední migrace ověřená v produkční D1'
        required: true
        default: '0031_skript_verze.sql'

permissions:
  contents: read

concurrency: deploy-web-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cry68c9cyg-stack/james-dean-web
          ref: JDWEB
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Testy webu
        run: npx vitest run
      - name: Ověření tokenu a účtu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          r=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)
          echo "$r" | jq -c '{success, accounts: (.result | length)}' 2> /dev/null || { echo "Cloudflare neodpověděl JSONem."; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$(echo "$r" | jq -r '.result[0].id')" >> "$GITHUB_ENV"
      - name: Migrace (repozitář nesmí mít novější, než je ověřená v D1)
        env:
          OVERENA: ${{ inputs.overena_migrace }}
        run: |
          posledni=$(find migrations -maxdepth 1 -name '*.sql' -printf '%f\n' | sort | tail -1)
          if [ "$posledni" != "$OVERENA" ]; then echo "::error::Poslední migrace v repozitáři je $posledni, ověřená v D1 je $OVERENA. Web se nenasadí."; exit 1; fi
          echo "Poslední migrace $posledni je v produkční D1."
      - name: Produkční build, nahrání a nasazení verze
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ENV: production
        run: |
          npx astro build
          out=$(npx wrangler versions upload --message "OKO1 Actions $GITHUB_RUN_ID" 2>&1) || { echo "$out" | tail -20; exit 1; }
          echo "$out" | tail -5
          id=$(echo "$out" | grep -oE 'Worker Version ID: [0-9a-f-]{36}' | awk '{print $4}')
          [ -n "$id" ] || { echo "::error::Nahraná verze nemá ID."; exit 1; }
          npx wrangler versions deploy "$id@100%" --yes --message "OKO1 Actions $GITHUB_RUN_ID"
      - name: Kontrola, že web odpovídá
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' https://jamesdean.cz/) && [ "$code" = 200 ] && { echo "jamesdean.cz odpovídá 200."; exit 0; }
            sleep 10
          done
          echo "::error::jamesdean.cz po nasazení neodpovídá 200 (poslední kód $code)."; exit 1

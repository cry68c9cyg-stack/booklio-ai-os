name: Nasazení OKO1

# Nasadí worker `oko1` (env production) na Cloudflare.
# Potřebuje tajemství repozitáře CLOUDFLARE_API_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fetch_from:
        description: 'Načíst z OneDrive dny od (YYYY-MM-DD), např. historii z peněžního deníku'
        required: false
      fetch_to:
        description: 'do (YYYY-MM-DD)'
        required: false

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Ověření tokenu a účtu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          r=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)
          echo "$r" | jq -c '{success, errors, accounts: (.result | length)}'
          echo "CLOUDFLARE_ACCOUNT_ID=$(echo "$r" | jq -r '.result[0].id')" >> "$GITHUB_ENV"
      - name: Archiv R2 v EU (vytvoří se jen poprvé)
        id: archive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if out=$(npx wrangler r2 bucket create oko1-archive --jurisdiction eu 2>&1); then echo "Kbelík oko1-archive vytvořen."; echo "ok=true" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -qi 'already exists'; then echo "Kbelík oko1-archive už existuje."; echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "$out" | tail -5; echo "::warning::Archiv R2 nejde vytvořit, OKO1 se nasadí bez archivu."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi
      - name: KV pro přihlášení k MCP serveru (jmenný prostor oko1-oauth, vytvoří se jen poprvé)
        id: oauth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          id=""
          for page in 1 2 3 4 5; do
            r=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=100&page=$page") || break
            echo "$r" | jq -e '.success' > /dev/null || break
            id=$(echo "$r" | jq -r 'first(.result[]? | select(.title == "oko1-oauth") | .id) // empty')
            if [ -n "$id" ] || [ "$(echo "$r" | jq '.result | length')" -lt 100 ]; then break; fi
          done
          if [ -n "$id" ]; then echo "Jmenný prostor oko1-oauth už existuje."
          else
            r=$(curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' --data '{"title":"oko1-oauth"}' "$api" || true)
            id=$(echo "$r" | jq -r '.result.id // empty' 2> /dev/null || true)
            if [ -n "$id" ]; then echo "Jmenný prostor oko1-oauth vytvořen."; else echo "$r" | jq -c '.errors' 2> /dev/null || true; fi
          fi
          if [ -n "$id" ]; then echo "id=$id" >> "$GITHUB_OUTPUT"
          else echo "KV pro přihlášení k MCP token nasazení nevidí (nemá Workers KV Storage), použije se id oko1-oauth z wrangler.jsonc."; fi
      - name: Nasazení
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ARCHIVE_OK: ${{ steps.archive.outputs.ok }}
          OAUTH_KV_ID: ${{ steps.oauth.outputs.id }}
        run: |
          # Config of this deploy: the id of the MCP server's KV (without it no MCP) and, without the bucket, no R2 binding
          # (it would stop the deploy).
          node -e 'const fs=require("fs");const c=JSON.parse(fs.readFileSync("wrangler.jsonc","utf8").split("\n").filter(l=>!/^\s*\/\//.test(l)).join("\n"));const p=c.env.production;if(process.env.OAUTH_KV_ID)p.kv_namespaces=[{binding:"OAUTH_KV",id:process.env.OAUTH_KV_ID}];else if(!p.kv_namespaces?.[0]?.id)delete p.kv_namespaces;if(process.env.ARCHIVE_OK!=="true")delete p.r2_buckets;fs.writeFileSync("wrangler.deploy.json",JSON.stringify(c))'
          npx wrangler deploy --env production --config wrangler.deploy.json
      - name: Správní heslo (odvozené z tokenu, nikde se neukládá)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          S=$(printf '%s' oko1-admin | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -r | cut -d' ' -f1)
          echo "::add-mask::$S"
          printf '%s' "$S" | npx wrangler secret put ADMIN_SECRET --env production
      - name: Nastavení provozoven (šifrované soubory v .github/oko1)
        env:
          SEAL_SEED: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_OS_URL: https://oko1.rr7whdyyhf.workers.dev
          # Sdílený odkaz (jen čtení) na složku s excely manažerů James Dean; do Gitu nepatří.
          ONEDRIVE_REPORTS_LINK: ${{ secrets.ONEDRIVE_REPORTS_LINK }}
        run: |
          pip install -q cryptography
          echo "Veřejný klíč pro šifrování: $(python3 -I .github/scripts/sealed.py pubkey)"
          export AI_OS_ADMIN_SECRET=$(printf '%s' oko1-admin | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -r | cut -d' ' -f1)
          for f in .github/oko1/*.config.enc; do
            [ -e "$f" ] || continue
            tenant=$(basename "$f" .config.enc)
            python3 -I .github/scripts/sealed.py open "$f" "$RUNNER_TEMP/$tenant.json"
            link=$(printf '%s' "$ONEDRIVE_REPORTS_LINK" | tr -d '[:space:]')
            if [ "$tenant" = james-dean ] && [ -n "$link" ]; then
              jq --arg l "$link" '.reportsLink = $l' "$RUNNER_TEMP/$tenant.json" > "$RUNNER_TEMP/$tenant.tmp" && mv "$RUNNER_TEMP/$tenant.tmp" "$RUNNER_TEMP/$tenant.json"
            fi
            # Live reading of the web James Dean (docs/web-v1.md); its token is the Worker secret WEB_TOKEN_JAMES_DEAN, never in the config.
            if [ "$tenant" = james-dean ]; then
              jq '.web = {url: "https://jamesdean.cz"}' "$RUNNER_TEMP/$tenant.json" > "$RUNNER_TEMP/$tenant.tmp" && mv "$RUNNER_TEMP/$tenant.tmp" "$RUNNER_TEMP/$tenant.json"
              # Public address of the venue (V Kolkovně, Praha 1) for the weather forecast; nothing else is sent to MET Norway.
              jq '.location = {lat: 50.0899, lon: 14.4207}' "$RUNNER_TEMP/$tenant.json" > "$RUNNER_TEMP/$tenant.tmp" && mv "$RUNNER_TEMP/$tenant.tmp" "$RUNNER_TEMP/$tenant.json"
            fi
            # A wrong link must not stop the other venues and steps: store the config without it and warn.
            if ! out=$(node scripts/admin.ts config "$tenant" "$RUNNER_TEMP/$tenant.json"); then
              echo "::warning::Nastavení $tenant odmítnuto, zkouším bez odkazu na OneDrive."
              jq 'del(.reportsLink)' "$RUNNER_TEMP/$tenant.json" > "$RUNNER_TEMP/$tenant.tmp" && mv "$RUNNER_TEMP/$tenant.tmp" "$RUNNER_TEMP/$tenant.json"
              out=$(node scripts/admin.ts config "$tenant" "$RUNNER_TEMP/$tenant.json")
            fi
            echo "$out" | jq -c '(.reportsLink |= (if . then "nastaven" else null end)) | del(.recipients, .dashboardPhones)'
            rm "$RUNNER_TEMP/$tenant.json"
          done
      - name: Ceny podniků v okolí (veřejné lístky, .github/oko1/*.competitors.json)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_OS_URL: https://oko1.rr7whdyyhf.workers.dev
        run: |
          export AI_OS_ADMIN_SECRET=$(printf '%s' oko1-admin | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -r | cut -d' ' -f1)
          for f in .github/oko1/*.competitors.json; do
            [ -e "$f" ] || continue
            if out=$(node scripts/admin.ts competitors "$(basename "$f" .competitors.json)" "$f"); then echo "$out" | jq -c .; else echo "::warning::Ceny okolí z $f se neuložily."; fi
          done
      - name: Načtení dnů z OneDrive (jen ručně spuštěné nasazení s rozsahem dnů)
        if: github.event_name == 'workflow_dispatch' && (inputs.fetch_from != '' || inputs.fetch_to != '')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_OS_URL: https://oko1.rr7whdyyhf.workers.dev
          FROM: ${{ inputs.fetch_from }}
          TO: ${{ inputs.fetch_to }}
        run: |
          export AI_OS_ADMIN_SECRET=$(printf '%s' oko1-admin | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -r | cut -d' ' -f1)
          to=${TO:-$FROM}
          [[ "$FROM" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$to" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && ! "$FROM" > "$to" ]] || { echo "::error::Rozsah dnů musí být YYYY-MM-DD a „od“ nejpozději „do“."; exit 1; }
          (( ($(date -u -d "$to" +%s) - $(date -u -d "$FROM" +%s)) / 86400 < 62 )) || { echo "::error::Najednou nejvýš 62 dnů."; exit 1; }
          d="$FROM"; n=0
          while [[ ! "$d" > "$to" ]] && (( n < 62 )); do
            # Days that already have the managers' daily report stay as they are; a failed day does not stop the others.
            node scripts/admin.ts fetch james-dean "$d" --keep | jq -c --arg d "$d" '{den: $d, nalezeno: .found, ponechano: (.kept // false), upozorneni: .warnings}' || echo "::warning::Den $d se nenačetl."
            d=$(date -u -d "$d + 1 day" +%F); n=$((n + 1))
          done
      - name: Spárování rezervačního systému (web James Dean posílá rezervace, jen poprvé)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_OS_URL: https://oko1.rr7whdyyhf.workers.dev
          WEB: james-dean-web-production
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WEB/secrets"
          names=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")
          if ! echo "$names" | jq -e '.success' > /dev/null; then echo "::warning::Tajemství webu nejde přečíst, rezervace se nespárují."; echo "$names" | jq -c '.errors' 2> /dev/null || echo "Cloudflare neodpověděl JSONem."; exit 0; fi
          if echo "$names" | jq -e '.result | map(.name) | index("OKO1_TOKEN")' > /dev/null; then echo "Web už je spárovaný."; exit 0; fi
          # The web gets its own installation and token: it can only send records into OKO1 and is revocable on its own.
          export AI_OS_ADMIN_SECRET=$(printf '%s' oko1-admin | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -r | cut -d' ' -f1)
          id="booklio-web-$GITHUB_RUN_ID"; token=$(openssl rand -hex 32); echo "::add-mask::$token"
          jq -n --arg i "$id" --arg t "$token" '{installationId: $i, token: $t}' > "$RUNNER_TEMP/pair.json"
          node scripts/admin.ts pair james-dean "$RUNNER_TEMP/pair.json" > /dev/null; rm "$RUNNER_TEMP/pair.json"
          # wrangler instead of the raw secrets API: it handles the web's versioned deployments (the raw PUT timed out).
          # Run outside the repo so OKO1's own wrangler.jsonc does not apply; the token goes in the same bulk upload.
          jq -n --arg u "$AI_OS_URL" --arg i "$id" --arg t "$token" '{OKO1_URL: $u, OKO1_PROVOZOVNA: "james-dean", OKO1_INSTALACE: $i, OKO1_TOKEN: $t}' > "$RUNNER_TEMP/web.json"
          if (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" secret bulk web.json --name "$WEB"); then echo "Web spárován jako $id."
          else echo "::warning::Tajemství webu se nepodařilo uložit, zkusí se při dalším nasazení."; fi
          rm -f "$RUNNER_TEMP/web.json"
      - name: Token pro živé čtení webu James Dean (OKO1_CTENI_TOKEN ve webu, WEB_TOKEN_JAMES_DEAN v OKO1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_OS_URL: https://oko1.rr7whdyyhf.workers.dev
          WEB: james-dean-web-production
        run: |
          export AI_OS_ADMIN_SECRET=$(printf '%s' oko1-admin | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -r | cut -d' ' -f1)
          check() { node scripts/admin.ts web james-dean 2> /dev/null || echo '{"ok": false, "error": "kontrola selhala"}'; }
          names=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WEB/secrets" || true)
          if ! echo "$names" | jq -e '.success' > /dev/null 2>&1; then echo "::warning::Tajemství webu nejde přečíst, token pro čtení webu se nevytvoří."; exit 0; fi
          if echo "$names" | jq -e '.result | map(.name) | index("OKO1_CTENI_TOKEN")' > /dev/null; then
            status=$(check); echo "$status" | jq -c '{ok, tabulky: .tables, chyba: .error}' || true
            if echo "$status" | jq -e '.ok' > /dev/null 2>&1; then
              echo "OKO1 čte web. Výměna tokenu: smažte obě tajemství (OKO1_CTENI_TOKEN ve webu, WEB_TOKEN_JAMES_DEAN v OKO1) a spusťte nasazení."; exit 0
            fi
            # Only a missing or refused token means a new pair; a web that is down or not deployed yet is just a warning.
            if ! echo "$status" | jq -e '.token == false or ((.error // "") | startswith("HTTP 401"))' > /dev/null 2>&1; then
              echo "::warning::OKO1 teď web nepřečte, token zůstává: $(echo "$status" | jq -r '.error // "neznámá chyba"' 2> /dev/null)"; exit 0
            fi
          fi
          # A new pair: OKO1 first, then the web. If the web fails, the next deploy finds the token refused and makes a new pair.
          token=$(openssl rand -hex 32); echo "::add-mask::$token"
          if ! printf '%s' "$token" | npx wrangler secret put WEB_TOKEN_JAMES_DEAN --env production > /dev/null; then
            echo "::warning::Token se do OKO1 nepodařilo uložit, zkusí se při dalším nasazení."; exit 0
          fi
          jq -n --arg t "$token" '{OKO1_CTENI_TOKEN: $t}' > "$RUNNER_TEMP/web-cteni.json"
          # Outside the repo, so OKO1's own wrangler.jsonc does not apply (like the pairing of the reservation system).
          if (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" secret bulk web-cteni.json --name "$WEB" > /dev/null); then echo "Token pro čtení webu uložen do webu i do OKO1."
          else echo "::warning::Token se do webu nepodařilo uložit, zkusí se při dalším nasazení."; fi
          rm -f "$RUNNER_TEMP/web-cteni.json"
          sleep 10
          check | jq -c '{ok, tabulky: .tables, chyba: .error}' || echo "::warning::Kontrolu čtení webu nejde spustit."
      - name: Příjem dat (kdo a kdy naposledy poslal, bez obsahu a počtů)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_OS_URL: https://oko1.rr7whdyyhf.workers.dev
        run: |
          export AI_OS_ADMIN_SECRET=$(printf '%s' oko1-admin | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -r | cut -d' ' -f1)
          node scripts/admin.ts ingest james-dean 2> /dev/null | jq -c '{instalace: [.installations[] | {installationId, pairedAt, lastSeenAt}],
            davky: [.batches[] | {installationId, receivedAt}], typy: [.records[] | {type, lastReceivedAt}]}' || echo "::warning::Stav příjmu dat nejde přečíst."
      - name: SMS brána (BulkGate, případně Twilio), jen když jsou tajemství vyplněná
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BG_ID: ${{ secrets.BULKGATE_APP_ID }}
          BG_TOKEN: ${{ secrets.BULKGATE_TOKEN }}
          SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          FROM: ${{ vars.SMS_SENDER || 'JamesDean' }}
          WA: ${{ vars.WHATSAPP_SENDER }}
        run: |
          c() { printf '%s' "$1" | tr -d '[:space:]'; }
          f="$RUNNER_TEMP/sms.json"
          jq -n --arg bi "$(c "$BG_ID")" --arg bt "$(c "$BG_TOKEN")" --arg s "$(c "$SID")" --arg t "$(c "$TOKEN")" --arg f "$FROM" --arg wa "$(c "$WA")" \
            '{SMS_SENDER: $f, TWILIO_FROM: $f}
             + (if $bi != "" and $bt != "" then {BULKGATE_APP_ID: $bi, BULKGATE_TOKEN: $bt} else {} end)
             + (if $s != "" and $t != "" then {TWILIO_ACCOUNT_SID: $s, TWILIO_AUTH_TOKEN: $t} else {} end)
             + (if $wa != "" then {WHATSAPP_SENDER: $wa} else {} end)' > "$f"
          jq -r 'keys | join(", ")' "$f"
          npx wrangler secret bulk "$f" --env production
          rm "$f"
      - name: Klíč Claude API pro rozbor „Report dne“, jen když je vyplněný
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          k=$(printf '%s' "$KEY" | tr -d '[:space:]')
          if [ -z "$k" ]; then echo "ANTHROPIC_API_KEY není vyplněný, Report dne půjde do zprávy jako text."; exit 0; fi
          printf '%s' "$k" | npx wrangler secret put ANTHROPIC_API_KEY --env production
      - name: Klíč iÚčta pro náklady (IUCTO_API_KEY, v OKO1 jako IUCTO_KEY_JAMES_DEAN), jen když je vyplněný
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KEY: ${{ secrets.IUCTO_API_KEY }}
        run: |
          k=$(printf '%s' "$KEY" | tr -d '[:space:]')
          if [ -z "$k" ]; then echo "IUCTO_API_KEY není vyplněný, ranní zpráva bude bez nákladů."; exit 0; fi
          echo "::add-mask::$k"
          printf '%s' "$k" | npx wrangler secret put IUCTO_KEY_JAMES_DEAN --env production > /dev/null
          echo "Klíč iÚčta uložen."
      - name: Zkušební SMS (jen když commit obsahuje [test-sms])
        if: contains(github.event.head_commit.message, '[test-sms]')
        env:
          SEAL_SEED: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BG_ID: ${{ secrets.BULKGATE_APP_ID }}
          BG_TOKEN: ${{ secrets.BULKGATE_TOKEN }}
          FROM: ${{ vars.SMS_SENDER || 'JamesDean' }}
        run: |
          python3 -I .github/scripts/sealed.py open .github/oko1/james-dean.config.enc "$RUNNER_TEMP/jd.json"
          TO=$(jq -r '.recipients[0]' "$RUNNER_TEMP/jd.json" | tr -d '+'); rm "$RUNNER_TEMP/jd.json"
          echo "::add-mask::$TO"
          jq -n --arg i "$(printf '%s' "$BG_ID" | tr -d '[:space:]')" --arg t "$(printf '%s' "$BG_TOKEN" | tr -d '[:space:]')" --arg n "$TO" --arg f "$FROM" \
            '{application_id: $i, application_token: $t, number: [$n],
              text: "OKO1: zkusebni zprava. Ranni prehledy James Dean budou chodit sem.",
              channel: {sms: {sender_id: "gText", sender_id_value: $f, unicode: false}}}' \
            | curl -sS -H 'content-type: application/json' --data @- https://portal.bulkgate.com/api/2.0/advanced/transactional \
            | jq -c 'del(.data.response[]?.number) | del(.data.total)'

name: Nasazení OKO1

# Nasadí worker `oko1` (env production) na Cloudflare.
# Potřebuje tajemství repozitáře CLOUDFLARE_API_TOKEN.
on:
  push:
    branches: [claude/project-thread-sywvkg]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Ověření tokenu a účtu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          r=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)
          echo "$r" | jq -c '{success, errors, accounts: (.result | length)}'
          echo "CLOUDFLARE_ACCOUNT_ID=$(echo "$r" | jq -r '.result[0].id')" >> "$GITHUB_ENV"
      - run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Správní heslo (odvozené z tokenu, nikde se neukládá)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          S=$(printf '%s' oko1-admin | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -r | cut -d' ' -f1)
          echo "::add-mask::$S"
          printf '%s' "$S" | npx wrangler secret put ADMIN_SECRET --env production
      - name: Nastavení provozoven (šifrované soubory v .github/oko1)
        env:
          SEAL_SEED: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_OS_URL: https://oko1.rr7whdyyhf.workers.dev
        run: |
          pip install -q cryptography
          echo "Veřejný klíč pro šifrování: $(python3 -I .github/scripts/sealed.py pubkey)"
          export AI_OS_ADMIN_SECRET=$(printf '%s' oko1-admin | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -r | cut -d' ' -f1)
          for f in .github/oko1/*.config.enc; do
            [ -e "$f" ] || continue
            tenant=$(basename "$f" .config.enc)
            python3 -I .github/scripts/sealed.py open "$f" "$RUNNER_TEMP/$tenant.json"
            node scripts/admin.ts config "$tenant" "$RUNNER_TEMP/$tenant.json" | jq -c 'del(.recipients)'
            rm "$RUNNER_TEMP/$tenant.json"
          done
      - name: Twilio (SMS), jen když jsou tajemství vyplněná
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          FROM: ${{ vars.TWILIO_FROM || 'JamesDean' }}
        run: |
          if [ -z "$SID" ] || [ -z "$TOKEN" ]; then echo "Twilio zatím není nastavené."; exit 0; fi
          f="$RUNNER_TEMP/twilio.json"
          jq -n --arg s "$(printf '%s' "$SID" | tr -d '[:space:]')" --arg t "$(printf '%s' "$TOKEN" | tr -d '[:space:]')" --arg f "$FROM" \
            '{TWILIO_ACCOUNT_SID: $s, TWILIO_AUTH_TOKEN: $t, TWILIO_FROM: $f}' > "$f"
          npx wrangler secret bulk "$f" --env production
          rm "$f"

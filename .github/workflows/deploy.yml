name: Nasazení OKO1

# Nasadí worker `oko1` (env production) na Cloudflare.
# Potřebuje tajemství repozitáře CLOUDFLARE_API_TOKEN.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Ověření tokenu a účtu
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          r=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts)
          echo "$r" | jq -c '{success, errors, accounts: (.result | length)}'
          echo "CLOUDFLARE_ACCOUNT_ID=$(echo "$r" | jq -r '.result[0].id')" >> "$GITHUB_ENV"
      - name: Archiv R2 v EU (vytvoří se jen poprvé)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          out=$(npx wrangler r2 bucket create oko1-archive --jurisdiction eu 2>&1) && echo "Kbelík oko1-archive vytvořen." && exit 0
          echo "$out" | grep -qi 'already exists' && echo "Kbelík oko1-archive už existuje." && exit 0
          echo "$out"; exit 1
      - run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Správní heslo (odvozené z tokenu, nikde se neukládá)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          S=$(printf '%s' oko1-admin | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -r | cut -d' ' -f1)
          echo "::add-mask::$S"
          printf '%s' "$S" | npx wrangler secret put ADMIN_SECRET --env production
      - name: Nastavení provozoven (šifrované soubory v .github/oko1)
        env:
          SEAL_SEED: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AI_OS_URL: https://oko1.rr7whdyyhf.workers.dev
          # Sdílený odkaz (jen čtení) na složku s excely manažerů James Dean; do Gitu nepatří.
          ONEDRIVE_REPORTS_LINK: ${{ secrets.ONEDRIVE_REPORTS_LINK }}
        run: |
          pip install -q cryptography
          echo "Veřejný klíč pro šifrování: $(python3 -I .github/scripts/sealed.py pubkey)"
          export AI_OS_ADMIN_SECRET=$(printf '%s' oko1-admin | openssl dgst -sha256 -hmac "$CLOUDFLARE_API_TOKEN" -r | cut -d' ' -f1)
          for f in .github/oko1/*.config.enc; do
            [ -e "$f" ] || continue
            tenant=$(basename "$f" .config.enc)
            python3 -I .github/scripts/sealed.py open "$f" "$RUNNER_TEMP/$tenant.json"
            link=$(printf '%s' "$ONEDRIVE_REPORTS_LINK" | tr -d '[:space:]')
            if [ "$tenant" = james-dean ] && [ -n "$link" ]; then
              jq --arg l "$link" '.reportsLink = $l' "$RUNNER_TEMP/$tenant.json" > "$RUNNER_TEMP/$tenant.tmp" && mv "$RUNNER_TEMP/$tenant.tmp" "$RUNNER_TEMP/$tenant.json"
            fi
            node scripts/admin.ts config "$tenant" "$RUNNER_TEMP/$tenant.json" | jq -c '(.reportsLink |= (if . then "nastaven" else null end)) | del(.recipients)'
            rm "$RUNNER_TEMP/$tenant.json"
          done
      - name: SMS brána (BulkGate, případně Twilio), jen když jsou tajemství vyplněná
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BG_ID: ${{ secrets.BULKGATE_APP_ID }}
          BG_TOKEN: ${{ secrets.BULKGATE_TOKEN }}
          SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          FROM: ${{ vars.SMS_SENDER || 'JamesDean' }}
          WA: ${{ vars.WHATSAPP_SENDER }}
        run: |
          c() { printf '%s' "$1" | tr -d '[:space:]'; }
          f="$RUNNER_TEMP/sms.json"
          jq -n --arg bi "$(c "$BG_ID")" --arg bt "$(c "$BG_TOKEN")" --arg s "$(c "$SID")" --arg t "$(c "$TOKEN")" --arg f "$FROM" --arg wa "$(c "$WA")" \
            '{SMS_SENDER: $f, TWILIO_FROM: $f}
             + (if $bi != "" and $bt != "" then {BULKGATE_APP_ID: $bi, BULKGATE_TOKEN: $bt} else {} end)
             + (if $s != "" and $t != "" then {TWILIO_ACCOUNT_SID: $s, TWILIO_AUTH_TOKEN: $t} else {} end)
             + (if $wa != "" then {WHATSAPP_SENDER: $wa} else {} end)' > "$f"
          jq -r 'keys | join(", ")' "$f"
          npx wrangler secret bulk "$f" --env production
          rm "$f"
      - name: Klíč Claude API pro rozbor „Report dne“, jen když je vyplněný
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          k=$(printf '%s' "$KEY" | tr -d '[:space:]')
          if [ -z "$k" ]; then echo "ANTHROPIC_API_KEY není vyplněný, Report dne půjde do zprávy jako text."; exit 0; fi
          printf '%s' "$k" | npx wrangler secret put ANTHROPIC_API_KEY --env production
      - name: Zkušební SMS (jen když commit obsahuje [test-sms])
        if: contains(github.event.head_commit.message, '[test-sms]')
        env:
          SEAL_SEED: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BG_ID: ${{ secrets.BULKGATE_APP_ID }}
          BG_TOKEN: ${{ secrets.BULKGATE_TOKEN }}
          FROM: ${{ vars.SMS_SENDER || 'JamesDean' }}
        run: |
          python3 -I .github/scripts/sealed.py open .github/oko1/james-dean.config.enc "$RUNNER_TEMP/jd.json"
          TO=$(jq -r '.recipients[0]' "$RUNNER_TEMP/jd.json" | tr -d '+'); rm "$RUNNER_TEMP/jd.json"
          echo "::add-mask::$TO"
          jq -n --arg i "$(printf '%s' "$BG_ID" | tr -d '[:space:]')" --arg t "$(printf '%s' "$BG_TOKEN" | tr -d '[:space:]')" --arg n "$TO" --arg f "$FROM" \
            '{application_id: $i, application_token: $t, number: [$n],
              text: "OKO1: zkusebni zprava. Ranni prehledy James Dean budou chodit sem.",
              channel: {sms: {sender_id: "gText", sender_id_value: $f, unicode: false}}}' \
            | curl -sS -H 'content-type: application/json' --data @- https://portal.bulkgate.com/api/2.0/advanced/transactional \
            | jq -c 'del(.data.response[]?.number) | del(.data.total)'

name: Kontrola tokenu Cloudflare
on:
  push:
    branches: [claude/project-thread-sywvkg]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Tvar tokenu a ověření (bez vypsání hodnoty)
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "delka=${#T}"
          printf '%s' "$T" | grep -q '^[[:space:]]' && echo "mezera na zacatku" || true
          printf '%s' "$T" | grep -q '[[:space:]]$' && echo "mezera na konci" || true
          printf '%s' "$T" | grep -c '' | sed 's/^/radku=/'
          printf '%s' "$T" | grep -q '^[0-9a-f]*$' && echo "jen hex (Global API Key?)" || true
          echo "prefix=$(printf '%s' "$T" | tr -d '[:space:]' | cut -c1-5 | sed 's/[A-Za-z0-9]/x/g;s/^cfat_/cfat_/')"
          printf '%s' "$T" | tr -d '[:space:]' | grep -qE '^cf(at|ut)_' && echo "novy format tokenu: $(printf '%s' "$T" | tr -d '[:space:]' | cut -c1-5)" || true
          C=$(printf '%s' "$T" | tr -d '[:space:]')
          echo "--- /user/tokens/verify (orezany)"; curl -sS -H "Authorization: Bearer $C" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success,errors,status:.result.status}'
          echo "--- /accounts (orezany)"; curl -sS -H "Authorization: Bearer $C" https://api.cloudflare.com/client/v4/accounts | jq -c '{success,errors,n:(.result|length)}'
